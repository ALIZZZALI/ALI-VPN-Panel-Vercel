:root{color-scheme:dark;--bg:#0b1115;--panel:#111a1f;--panel2:#151f25;--panel3:#1b282e;--line:#27383f;--line2:#31464e;--text:#e9f1f2;--muted:#91a5aa;--soft:#b9c7ca;--accent:#63d5c3;--accent2:#8ee5d8;--accent-bg:rgba(var(--accent-rgb),.11);--gold:#e9bd72;--red:#f07e83;--green:#75d7a2;--blue:#8dbcf5;--purple:#bda7ff;--shadow:0 18px 55px rgba(0,0,0,.24);--radius:15px;--font:"ALI-Vazirmatn","Vazirmatn",Tahoma,"Segoe UI",sans-serif;--mono:"Cascadia Code","JetBrains Mono",Consolas,monospace;--accent-rgb:99,213,195;--accent-ink:#061b1a;--surface-0:#071014;--surface-input:#0c1519;--surface-2:#101a1f;--surface-3:#121e23;--surface-hover:#20333a;--topbar-bg:rgba(13,21,25,.88);--sidebar-bg:rgba(13,21,25,.36);--mobile-nav-bg:rgba(10,17,21,.96)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(1100px 500px at 85% -12%,rgba(44,133,126,.12),transparent 60%),var(--bg);color:var(--text);font:14px/1.8 var(--font);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}a{color:var(--accent);text-decoration:none}::selection{background:rgba(var(--accent-rgb),.25)}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;overflow-wrap:anywhere}.num{font-variant-numeric:tabular-nums}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel2);padding:3px 9px;border-radius:999px;font-size:11px;white-space:nowrap}.pill.good{color:var(--green);border-color:rgba(117,215,162,.25);background:rgba(117,215,162,.08)}.pill.warn{color:var(--gold);border-color:rgba(233,189,114,.24);background:rgba(233,189,114,.08)}.pill.bad{color:var(--red);border-color:rgba(240,126,131,.26);background:rgba(240,126,131,.08)}.pill.info{color:var(--blue);border-color:rgba(141,188,245,.24);background:rgba(141,188,245,.08)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);color:var(--text);background:var(--panel3);padding:9px 14px;border-radius:10px;min-height:39px;transition:.15s ease;text-decoration:none;font-size:13px;font-weight:600}.btn:hover{border-color:#50736f;background:var(--surface-hover);transform:translateY(-1px)}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.btn.primary:hover{background:var(--accent2)}.btn.ghost{background:transparent}.btn.danger{background:rgba(240,126,131,.1);color:var(--red);border-color:rgba(240,126,131,.28)}.btn.warning{color:var(--gold);border-color:rgba(233,189,114,.28);background:rgba(233,189,114,.08)}.btn.smallbtn{padding:5px 9px;min-height:30px;font-size:12px;border-radius:8px}.btn.iconbtn{width:38px;padding:0;min-width:38px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field label,.field-label{font-size:12px;color:var(--soft);font-weight:700}.field input,.field select,.field textarea{width:100%;min-width:0;background:var(--surface-input);color:var(--text);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;outline:none;transition:border .15s}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.07)}.field input::placeholder,.field textarea::placeholder{color:#637a81}.field input[dir=ltr],.field textarea[dir=ltr]{text-align:left}.field textarea{resize:vertical;min-height:110px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.form-grid .span2{grid-column:1/-1}.notice{padding:12px 14px;border:1px solid var(--line2);border-right:3px solid var(--accent);background:rgba(var(--accent-rgb),.05);color:var(--soft);border-radius:10px;font-size:12px}.notice.warn{border-right-color:var(--gold);background:rgba(233,189,114,.05)}.notice.danger{border-right-color:var(--red);background:rgba(240,126,131,.05)}
#loginScreen{min-height:100vh;display:grid;place-items:center;padding:22px}.login-wrap{width:min(430px,100%);background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line2);border-radius:22px;padding:32px;box-shadow:var(--shadow)}.brand-mark{width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:var(--accent-bg);color:var(--accent);font-weight:900;font-size:15px;border:1px solid rgba(var(--accent-rgb),.24);letter-spacing:-1px}.login-wrap .brand-mark{width:60px;height:60px;font-size:17px;margin-bottom:23px}.login-wrap h1{font-size:27px;margin:0 0 4px;letter-spacing:-.7px}.login-wrap p{color:var(--muted);margin:0 0 25px;font-size:13px}.login-wrap form{display:grid;gap:15px}.login-wrap input{padding:13px}.login-footer{border-top:1px solid var(--line);margin-top:22px;padding-top:15px;color:#6f858b;font-size:11px}

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const state={authenticated:false,mode:'direct',view:'dashboard',config:null,account:null,dashboard:null,services:[],total:0,offset:0,limit:25,serviceQuery:'',statusFilter:'all',serviceTypeFilter:'all',sortBy:'api',sortDir:'asc',selected:null,locations:null,logs:[],apiMethod:'me',lastRaw:null,lastSync:null,lastOperation:null,loading:false,pendingApiSave:null,preferences:{theme:'obsidian',last_mode:'direct',last_view:'dashboard',service_page_size:25},pendingImportData:null,pendingApiLab:null};let serviceSearchTimer=null;let modeEpoch=0;let backupPollTimer=null;

const THEME_META={obsidian:'#0b1115',violet:'#100d19',ocean:'#071421',emerald:'#081610',amber:'#171109'};
const THEMES=[{id:'obsidian',name:'آبسیدین و نعنایی',desc:'تیرهٔ متعادل با تأکید فیروزه‌ای',bg:'#0b1115',accent:'#63d5c3'},{id:'violet',name:'نیمه‌شب بنفش',desc:'عمق بنفش با کنتراست روشن',bg:'#100d19',accent:'#c0adff'},{id:'ocean',name:'اقیانوس عمیق',desc:'سرمه‌ای سرد با آبی یخی',bg:'#071421',accent:'#70ceff'},{id:'emerald',name:'جنگل زمردی',desc:'سبز تیره با تأکید زمردی',bg:'#081610',accent:'#7be5a8'},{id:'amber',name:'کربن کهربایی',desc:'زغالی گرم با طلایی کهربایی',bg:'#171109',accent:'#ffcb72'}];
function applyTheme(theme){const valid=THEMES.some(t=>t.id===theme)?theme:'obsidian';document.documentElement.dataset.theme=valid;const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=THEME_META[valid];try{localStorage.setItem('ali-vpn-theme',valid)}catch{}}
async function loadPreferences(){try{const r=await api('/api/preferences');if(r.ok&&r.preferences){state.preferences={...state.preferences,...r.preferences};if(MODE[state.preferences.last_mode])state.mode=state.preferences.last_mode;state.view=['dashboard','services','create','locations','apilab','logs','settings'].includes(state.preferences.last_view)?state.preferences.last_view:'dashboard';state.limit=Math.max(10,Math.min(100,Number(state.preferences.service_page_size)||25));applyTheme(state.preferences.theme);$$('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode));setActiveNav();return}}catch{}try{applyTheme(localStorage.getItem('ali-vpn-theme')||state.preferences.theme)}catch{applyTheme(state.preferences.theme)}}

const METHODS=[['me','GET','اطلاعات حساب، موجودی، قیمت‌ها و محدودیت‌ها'],['status','GET','وضعیت قدیمی حساب و اتصال سرویس'],['price','GET','محاسبه قیمت قبل از خرید؛ پارامترهای gig و day'],['get_hosts','GET','لوکیشن‌ها و دسته‌بندی اتصال‌ها'],['clients','GET','فهرست سرویس‌ها؛ limit و offset اختیاری'],['info','GET','جزئیات زنده سرویس؛ username الزامی'],['find','POST','جزئیات سازگار با نسخه قدیمی؛ username الزامی'],['create','POST','ساخت سرویس؛ test و در سرویس عادی gig/day'],['renew','POST','تمدید با حجم و زمان جدید؛ username/gig/day'],['upg_time','POST','افزایش مدت؛ username/day'],['upg_size','POST','افزایش حجم؛ username/gig'],['change_link','POST','باطل کردن لینک قبلی و ساخت لینک جدید'],['reverse_mode','POST','تغییر وضعیت؛ username/status=active یا disabled'],['delsv','POST','حذف سرویس و محاسبه برگشت وجه']];

const post=(path,data)=>api(path,{method:'POST',body:JSON.stringify(data)});

const bytesGB=v=>{if(v===null||v===undefined||v==='')return null;const n=Number(v);return Number.isFinite(n)?n/1073741824:null};

const serviceOf=r=>{if(!r)return null;let x=r.service||r;if(x&&x.result&&typeof x.result==='object')x=x.result.service||x.result;return x&&typeof x==='object'?x:null};
function statusPill(status){const s=String(status||'نامشخص').toLowerCase();let cls='info',label=status||'نامشخص';if(['active','فعال'].includes(s)){cls='good';label='فعال'}else if(['disabled','غیرفعال'].includes(s)){cls='bad';label='غیرفعال'}else if(['expired','منقضی'].includes(s)){cls='bad';label='منقضی'}else if(['limited'].includes(s)){cls='warn';label='اتمام حجم'}else if(['on_hold'].includes(s)){cls='warn';label='در انتظار اتصال'}return `<span class="pill ${cls}"><span class="status-dot"></span>${esc(label)}</span>`}

rtBackupBtn" data-action="export-data">↓ ساخت پشتیبان کامل از هر دو حساب</button><label class="btn ghost" for="importFile" style="cursor:pointer">↑ بازگردانی پشتیبان</label><input id="importFile" class="hidden" type="file" accept="application/json,.json"><span class="muted small">پشتیبان قدیمی نام مالکان نیز قابل ورود است.</span></div><div id="backupProgress" class="backup-progress hidden" role="status" aria-live="polite"><div class="backup-progress-top"><strong id="backupProgressStage">در حال ساخت پشتیبان…</strong><span id="backupProgressCount">آماده‌سازی</span></div><div class="progress"><span id="backupProgressBar" style="width:4%"></span></div><div id="backupProgressNote" class="muted small" style="margin-top:8px">هر دو حساب پردازش می‌شوند. از بستن پنل خودداری کن.</div></div></div></section>`;$('#apiSettingsForm').addEventListener('submit',saveApiConfig);$('#toggleApiKey').addEventListener('click',()=>{const f=$('#apiKeyInput');const show=f.type==='password';f.type=show?'text':'password';$('#toggleApiKey').textContent=show?'پنهان':'نمایش';$('#toggleApiKey').setAttribute('aria-pressed',show?'true':'false')});$('#passwordForm').addEventListener('submit',changePassword);$('#importFile').addEventListener('change',importMetadata);const themeSelect=$('#themeSelect');if(themeSelect)themeSelect.addEventListener('change',()=>selectTheme(themeSelect.value));showPhoneAddress()}
async function persistApiSettings({key='',clear=false,url}){const mode=state.mode;const r=await post('/api/config',{mode,api_key:key,clear_key:clear,api_url:url});if(!r.ok)throw new Error(r.error||'ذخیره تنظیمات ناموفق بود.');toast(r.message||'تنظیمات ذخیره شد.');if(state.mode!==mode)return;await loadConfig();if(state.view==='settings')renderSettings()}
async function saveApiConfig(e){e.preventDefault();const key=$('#apiKeyInput').value;const clear=$('#clearKey').checked;const url=$('#apiUrlInput').value.trim();if(clear&&key.trim()){toast('برای حذف کلید، هم‌زمان کلید جدید وارد نکن.','warn');return}const urlChanged=url!==(state.config?.api_url||MODE[state.mode].url);if(!key.trim()&&!clear&&!urlChanged){toast('تغییری برای ذخیره وجود ندارد.','warn');return}if(clear){state.pendingApiSave={key:'',clear:true,url};showModal('حذف کلید API',`حساب ${MODE[state.mode].fa}`,`<div class="notice danger">کلید ذخیره‌شدهٔ این حساب از ذخیره‌ساز حذف می‌شود. این کار ارتباط این حساب را تا زمان ورود کلید جدید قطع می‌کند.</div><div class="kv"><div class="key">حساب</div><div class="value">${esc(MODE[state.mode].fa)}</div><div class="key">نشانی</div><div class="value mono">${esc(url)}</div></div>`,`<button type="button" class="btn ghost" data-action="close-modal">انصراف</button><button type="button" class="btn danger" data-action="confirm-clear-key">حذف کلید و ذخیره</button>`);return}const btn=$('#saveApiBtn');loadingBtn(btn,true,'در حال ذخیره…');try{await persistApiSettings({key,url})}catch(err){toast(err.message,'bad')}finally{loadingBtn(btn,false)}}
async function resetApiUrl(){const url=MODE[state.mode].url;const mode=state.mode;try{const r=await post('/api/config',{mode,api_url:url});if(!r.ok)throw new Error(r.error||'بازگردانی آدرس ناموفق بود.');closeModal();toast('آدرس پیش‌فرض برای همین حساب بازگردانده شد.');await loadConfig();if(state.view==='settings')renderSettings()}catch(e){toast(e.message,'bad')}}
function requestResetApiUrl(){showModal('بازگردانی آدرس API',`فقط حساب ${MODE[state.mode].fa}`,`<div class="notice warn">آدرس همین حساب به مقدار پیش‌فرض بازمی‌گردد. کلید API و اطلاعات حساب حذف نمی‌شوند.</div><div class="kv"><div class="key">آدرس پیش‌فرض</div><div class="value mono">${esc(MODE[state.mode].url)}</div></div>`,`<button type="button" class="btn ghost" data-action="close-modal">انصراف</button><button type="button" class="btn primary" data-action="confirm-reset-api-url">بازگردانی آدرس</button>`)}
async function changePassword(e){e.preventDefault();const old=$('#oldPassword').value,nw=$('#newPassword').value,cn=$('#confirmPassword').value;if(nw!==cn){toast('رمز جدید و تکرارش یکسان نیستند.','warn');return}const btn=$('#changePasswordBtn');loadingBtn(btn,true,'در حال تغییر…');try{const r=await post('/api/account/password',{old_password:old,new_password:nw});if(!r.ok)throw new Error(r.error||'تغییر رمز ناموفق بود.');toast(r.message);$('#passwordForm').reset()}catch(err){toast(err.message,'bad')}finally{loadingBtn(btn,false)}}

function showModal(title,desc,content,foot='',wide=false){$('#modalHost').classList.remove('hidden');$('#modalHost').innerHTML=`<section class="modal ${wide?'wide':''}" role="document"><header class="modal-head"><div><h2>${esc(title)}</h2>${desc?`<p>${esc(desc)}</p>`:''}</div><button type="button" class="btn iconbtn ghost" data-action="close-modal" aria-label="بستن">×</button></header><div class="modal-content">${content}</div>${foot?`<footer class="modal-foot">${foot}</footer>`:''}</section>`;document.body.style.overflow='hidden';const first=$('#modalHost input:not([type=hidden]),#modalHost button');if(first)first.focus()}

function openConfirm({title,desc,warning,payload,confirmText='تأیید و اجرا',danger=false}){const raw=JSON.stringify(payload);showModal(title,'مرور نهایی عملیات قبل از ارسال به API',`<div class="notice ${danger?'danger':'warn'}">${esc(warning||'این عملیات روی حساب واقعی اجرا می‌شود.')}</div><div class="divider"></div><div class="kv"><div class="key">حساب مقصد</div><div class="value">${esc(MODE[payload.mode||state.mode].fa)}</div><div class="key">عملیات</div><div class="value mono">${esc(payload.action||'—')}</div>${payload.username?`<div class="key">شناسه سرویس</div><div class="value mono">${esc(payload.username)}</div>`:''}<div class="key">جزئیات</div><div class="value">${esc(desc)}</div></div>`,`<button type="button" class="btn ghost" data-action="close-modal">بازگشت</button><button type="button" class="btn ${danger?'danger':'primary'}" data-action="execute-confirm" data-payload="${esc(raw)}">${esc(confirmText)}</button>`)}
async function executeConfirmed(payload,btn){const mode=payload.mode||state.mode,epoch=modeEpoch;loadingBtn(btn,true,'در حال ارسال…');try{const r=await post('/api/service/action',{...payload,confirmed:true});if(mode!==state.mode||epoch!==modeEpoch){toast(r.ok?`عملیات حساب ${MODE[mode].fa} تمام شد؛ برای دیدن نتیجه به همان حساب برگرد.`:(r.response?.error||r.error||'عملیات ناموفق بود.'),r.ok?'good':'bad');return}state.lastRaw=r.response||r;if(!r.ok){toast(r.response?.error||r.error||'عملیات ناموفق بود.','bad');showRawResult(state.lastRaw,'پاسخ ناموفق API');return}closeModal();if(payload.action==='delsv'&&r.applied===false){toast(r.local_warning||'API حذف واقعی را تأیید نکرد؛ نام مالک محلی حفظ شد.','warn');state.lastOperation=null;state.selected=null;if(state.view==='services')fetchServices();if(state.view==='dashboard')fetchDashboard();return}toast(operationSuccess(payload.action,r.response));if(r.local_warning)toast(r.local_warning,'warn');if(payload.action==='create'){const root=r.response?.result||{};const svc=root.service||root;const u=r.username||svc.username||root.username;if(u){const amount=root.charged??root.price??null;state.lastOperation={mode,username:String(u),action:payload.action,actionLabel:'ساخت سرویس',amount};openService(u,r.detail)}else showRawResult(r.response,'پاسخ ساخت سرویس')}else if(payload.action==='delsv'){state.lastOperation=null;state.selected=null;if(state.view==='services')fetchServices();if(state.view==='dashboard')fetchDashboard();}else if(payload.username){const root=r.response?.result&&typeof r.response.result==='object'&&!Array.isArray(r.response.result)?r.response.result:{};const amount=root.charged??root.price??null;const labels={renew:'تمدید',upg_time:'افزایش زمان',upg_size:'افزایش حجم',change_link:'تغییر لینک',reverse_mode:'تغییر وضعیت'};state.lastOperation={mode,username:String(payload.username),action:payload.action,actionLabel:labels[payload.action]||payload.action,amount};openService(payload.username,r.detail)}if(state.view==='settings')loadConfig();}catch(e){toast(e.message,'bad')}finally{loadingBtn(btn,false)}}
function operationSuccess(action,r){if(action==='create')return 'درخواست ساخت با موفقیت انجام شد.';if(action==='renew')return 'سرویس تمدید شد.';if(action==='upg_time')return 'زمان سرویس افزایش یافت.';if(action==='upg_size')return 'حجم سرویس افزایش یافت.';if(action==='change_link')return 'لینک جدید ساخته شد؛ لینک قبلی دیگر معتبر نیست.';if(action==='reverse_mode'){const mode=r?.result?.new_mode??r?.result?.new_status??r?.result?.status;return `وضعیت سرویس ${mode==='active'?'فعال':mode==='disabled'?'غیرفعال':'تغییر یافت؛ وضعیت جدید در پاسخ API موجود است.'}.`}if(action==='delsv')return `سرویس حذف شد. مبلغ برگشتی اعلام‌شده: ${r?.return_price!==undefined?toman(r.return_price):'در پاسخ API مشخص نشده است.'}`;return 'عملیات انجام شد.'}

async function submitOperation(e){e.preventDefault();const mode=state.mode,epoch=modeEpoch;const f=e.currentTarget,op=f.dataset.op,username=f.dataset.username;let payload={mode,action:op,username};if(op==='renew'){payload.gig=Number($('#opGig').value);payload.day=Number($('#opDay').value)}else if(op==='upg_time')payload.day=Number($('#opDay').value);else payload.gig=Number($('#opGig').value);if((payload.day!==undefined&&(!Number.isFinite(payload.day)||payload.day<1))||(payload.gig!==undefined&&(!Number.isFinite(payload.gig)||payload.gig<0))){toast('مقدار واردشده معتبر نیست.','warn');return}let estimate=null;const btn=$('#opContinue');loadingBtn(btn,true,'بررسی هزینه…');try{if(op==='renew'){const q=await post('/api/call',{mode,method:'price',http_method:'GET',params:{gig:payload.gig,day:payload.day}});if(mode!==state.mode||epoch!==modeEpoch)return;state.lastRaw=q.response; if(!q.ok){state.lastRaw=q.response||q;showRawResult(state.lastRaw,'خطای استعلام قیمت');return}estimate=q.response?.result?.price;const enough=q.response?.result?.enough;$('#opCost').textContent=toman(estimate);$('#opCostHint').textContent=enough===false?'موجودی کافی نیست.':`موجودی فعلی ${toman(q.response?.result?.balance)}`;if(enough===false){toast('موجودی حساب کافی نیست.','bad');return}}else{const a=state.account||{},pr=a.prices||{};estimate=op==='upg_time'?Number(payload.day)*(state.selected?.unlimited?Number(pr.unlimited_per_day??0):Number(pr.per_day??a.per_day??0)):Number(payload.gig)*Number(pr.per_gb??a.per_gb??0);$('#opCost').textContent=toman(estimate);$('#opCostHint').textContent='برآورد محلی از تعرفه me؛ مبلغ نهایی را API محاسبه می‌کند.'}const desc=op==='renew'?`${fmtNum(payload.gig,2)} GB و ${fmtNum(payload.day)} روز · قیمت برآوردی ${toman(estimate)}`:op==='upg_time'?`${fmtNum(payload.day)} روز اضافه · هزینه برآوردی ${toman(estimate)}`:`${fmtNum(payload.gig,2)} GB اضافه · هزینه برآوردی ${toman(estimate)}`;openConfirm({title:'تأیید عملیات پولی',desc,warning:'با تأیید درخواست واقعی به API ا async function selectTheme(theme){const item=THEMES.find(t=>t.id===theme);if(!item)return;applyTheme(theme);state.preferences.theme=theme;if($('#themeDescription'))$('#themeDescription').textContent=item.desc;try{const r=await post('/api/preferences',{theme});if(!r.ok)throw new Error(r.error||'ذخیره تم ناموفق بود.');state.preferences={...state.preferences,...r.preferences};toast(`تم «${item.name}» اعمال و ذخیره شد.`)}catch(err){toast(err.message,'bad')}}
function exportMetadata(){if($('#exportBackupBtn')?.disabled)return;state.pendingBackupOptions={includeSecrets:$('#backupSecrets')?.checked!==false,includeDetails:$('#backupDetails')?.checked!==false};const o=state.pendingBackupOptions;showModal('ساخت پشتیبان کامل','هر دو حساب مستقیم و تانل',`<div class="notice ${o.includeSecrets?'warn':''}">${o.includeSecrets?'این فایل شامل کلیدهای API هر دو حساب، هش و salt رمز ورود، نام مالکان، تاریخچه و اسنپ‌شات کامل سرویس‌ها است. فایل را محرمانه نگه دار.':'کلیدهای API و تنظیمات رمز ورود در فایل قرار نمی‌گیرند؛ تنظیمات فعلی هنگام بازگردانی حفظ می‌شوند.'}</div><div class="account-list" style="margin-top:12px"><div class="account-row"><span>حساب‌ها</span><strong>مستقیم و تانل</strong></div><div class="account-row"><span>جزئیات عمیق</span><strong>${o.includeDetails?'دریافت info و کانفیگ‌ها':'فقط فهرست و خلاصه‌ها'}</strong></div><div class="account-row"><span>تنظیمات حساس</span><strong>${o.includeSecrets?'کلیدها و تنظیمات ورود':'بدون کلید و هش ورود'}</strong></div></div><p class="muted small" style="margin-top:12px">برای تعداد زیاد سرویس، دریافت تمام جزئیات ممکن است طول بکشد. در صورت شکست دریافت info، رکورد خلاصه و علت خطا در فایل ثبت می‌شود.</p>`,`<button class="btn primary" data-action="confirm-export-backup">شروع و دانلود پشتیبان</button><button class="btn ghost" data-action="cancel-export-backup">انصراف</button>`,false)}
async function runFullBackup(){const options=state.pendingBackupOptions||{includeSecrets:true,includeDetails:true};state.pendingBackupOptions=null;closeModal();const btn=$('#exportBackupBtn'),progress=$('#backupProgress');if(btn?.disabled)return;const includeSecrets=options.includeSecrets,includeDetails=options.includeDetails;loadingBtn(btn,true,'در حال آماده‌سازی…');progress?.classList.remove('hidden');if($('#backupProgressStage'))$('#backupProgressStage').textContent='در حال شروع ساخت پشتیبان';if($('#backupProgressCount'))$('#backupProgressCount').textContent='۰٪';if($('#backupProgressBar'))$('#backupProgressBar').style.width='4%';if($('#backupProgressNote'))$('#backupProgressNote').textContent='اطلاعات حساب‌ها، فهرست سرویس‌ها و جزئیات هر سرویس جمع‌آوری می‌شوند.';try{const started=await post('/api/data/export/start',{include_secrets:includeSecrets,include_service_details:includeDetails});if(!started.ok||!started.job_id)throw new Error(started.error||'شروع پشتیبان ناموفق بود.');const jobId=started.job_id;let finished=false;while(!finished){await new Promise(resolve=>setTimeout(resolve,850));const st=await api(`/api/data/export/status?id=${encodeURIComponent(jobId)}`);if(!st.ok)throw new Error(st.error||'وضعیت ساخت پشتیبان دریافت نشد.');if($('#backupProgressStage'))$('#backupProgressStage').textContent=st.stage||'در حال پردازش';const total=Number(st.total_services||0),done=Number(st.completed_services||0);let percent=Number(st.progress||0);if(st.status==='running'){percent=total?Math.max(5,Math.min(94,Math.round(8+done/Math.max(total,1)*84))):Math.max(4,Math.min(12,percent||7));}if($('#backupProgressBar'))$('#backupProgressBar').style.width=`${percent}%`;if($('#backupProgressCount'))$('#backupProgressCount').textContent=total?`${fmtNum(done)} از ${fmtNum(total)} · ${fmtNum(percent)}٪`:`${fmtNum(percent)}٪`;if(st.status==='failed')throw new Error(st.error||'ساخت پشتیبان ناموفق بود.');if(st.status==='complete'){finished=true;const response=await fetch(`/api/data/export/download?id=${encodeURIComponent(jobId)}`,{credentials:'same-origin',cache:'no-store'});if(!response.ok){let err={};try{err=await response.json()}catch{}throw new Error(err.error||'دانلود فایل پشتیبان ناموفق بود.')}const blob=await response.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`ALI-VPN-FULL-BACKUP-${new Date().toISOString().replace(/[:.]/g,'-')}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);if($('#backupProgressBar'))$('#backupProgressBar').style.width='100%';if($('#backupProgressCount'))$('#backupProgressCount').textContent='کامل';if($('#backupProgressNote'))$('#backupProgressNote').textContent='فایل کامل دانلود شد. اگر تعدادی از جزئیات زنده قابل دریافت نبودند، علت آن در بخش errors داخل فایل درج شده است.';toast('پشتیبان کامل مستقیم و تانل آماده شد.')}}}catch(err){if($('#backupProgressNote'))$('#backupProgressNote').textContent=err.message;toast(err.message,'bad')}finally{loadingBtn(btn,false)}}
async function importMetadata(e){const file=e.target.files?.[0];if(!file)return;try{if(file.size>100*1024*1024)throw new Error('فایل پشتیبان از سقف ۱۰۰ مگابایت بزرگ‌تر است.');const data=JSON.parse(await file.text());if(data?.format==='ALI-VPN-FULL-BACKUP-v2'){state.pendingImportData=data;showModal('بازگردانی پشتیبان کامل','مستقیم و تانل به‌صورت یکجا',`<div class="notice warn">این فایل تنظیمات محلی هر دو حساب، نام مالکان، تم، گزارش‌ها و در صورت وجود کلیدهای API و هش رمز ورود را بازنویسی می‌کند. سرویس‌های واقعی از API خوانده می‌شوند؛ این فایل سرویس را در سرور ایجاد یا حذف نمی‌کند.</div><p style="margin-top:12px" class="muted small">تاریخ پشتیبان: ${esc(data.exported_at||'نامشخص')} · جزئیات سرویس‌ها: ${fmtNum(Object.values(data.accounts||{}).reduce((n,a)=>n+(Array.isArray(a?.services)?a.services.length:0),0))}</p>`,`<button class="btn danger" data-action="confirm-import-backup">بازگردانی هر دو حساب</button><button class="btn ghost" data-action="cancel-import-backup">انصراف</button>`);return}const r=await post('/api/data/import',{data});if(!r.ok)throw new Error(r.error||'ورود ناموفق');toast(r.message);await loadPreferences();await loadConfig();if(state.view==='services')fetchServices()}catch(err){toast(err.message,'bad')}finally{e.target.value=''}}
async function confirmImportBackup(){const data=state.pendingImportData;if(!data)return;const btn=$('[data-action="confirm-import-backup"]');loadingBtn(btn,true,'در حال بازگردانی…');try{const r=await post('/api/data/import',{data});if(!r.ok)throw new Error(r.error||'بازگردانی ناموفق');state.pendingImportData=null;closeModal();await loadPreferences();await loadConfig();toast(r.message||'پشتیبان بازگردانی شد.');if(state.view==='services')fetchServices();else if(state.view==='dashboard')renderDashboard(true);else if(state.view==='settings')renderSettings()}catch(err){toast(err.message,'bad')}finally{loadingBtn(btn,false)}}
async function copyText(text){if(!text){toast('متنی برای کپی وجود ندارد.','warn');return}try{await navigator.clipboard.writeText(text);toast('در کلیپ‌بورد کپی شد.')}catch{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('در کلیپ‌بورد کپی شد.')}catch{toast('کپی خودکار انجام نشد.','warn')}ta.remove()}}
function openLink(url){if(!url||url==='—')return;try{const parsed=new URL(url);if(!['http:','https:'].includes(parsed.protocol)){toast('فقط لینک http/https باز می‌شود.','warn');return}window.open(parsed.href,'_blank','noopener,noreferrer')}catch{toast('لینک معتبر نیست.','warn')}}
// Global interactions: all action buttons route through the same handlers to keep desktop/mobile behavior aligned.
document.addEventListener('click',async e=>{const modeBtn=e.target.closest('[data-mode]');if(modeBtn){setMode(modeBtn.dataset.mode);return}const viewBtn=e.target.closest('[data-view]');if(viewBtn){loadView(viewBtn.dataset.view,true);return}const methodBtn=e.target.closest('[data-method]');if(methodBtn)return;const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action;try{switch(a){case'logout':{const r=await post('/api/logout',{});if(!r.ok)throw new Error(r.error||'خروج از پنل تأیید نشد؛ وضعیت نشست تغییر نکرد.');showLogin();toast('از پنل خارج شد');break;}case'close-modal':closeModal();break;case'refresh':await refreshEverything();break;case'test-connection':await testConnection();break;case'reset-api-url':requestResetApiUrl();break;case'confirm-reset-api-url':await resetApiUrl();break;case'confirm-clear-key':{const pending=state.pendingApiSave;if(!pending)break;state.pendingApiSave=null;closeModal();try{await persistApiSettings({key:'',clear:true,url:pending.url})}catch(err){toast(err.message,'bad')}break;}case'refresh-services':state.offset=0;fetchServices();break;case'refresh-locations':fetchLocations();break;case'refresh-logs':fetchLogs();break;case'clear-logs':{const mode=$('#logMode')?.value||state.mode;showModal('پاک‌کردن تاریخچه گزارش‌ها',mode==='all'?'هر دو حساب':'حساب '+MODE[mode].fa,'<div class="notice danger">گزارش‌های انتخاب‌شده از تاریخچه محلی این پنل حذف می‌شوند. این کار سرویس‌های API را تغییر نمی‌دهد.</div>',`<button class="btn ghost" data-action="close-modal">انصراف</button><button class="btn danger" data-action="confirm-clear-logs" data-mode="${mode}">پاک‌کردن گزارش‌ها</button>`);break;}case'confirm-clear-logs':{const mode=btn.dataset.mode||'all';loadingBtn(btn,true,'در حال پاک‌کردن…');try{const r=await post('/api/logs/clear',{mode});if(!r.ok)throw new Error(r.error||'پاک‌کردن گزارش‌ها ناموفق بود.');closeModal();toast(r.message||'تاریخچه پاک شد.');await fetchLogs()}catch(err){toast(err.message,'bad')}finally{loadingBtn(btn,false)}break;}case'refresh-phone':showPhoneAddress();break;case'load-account':{const ok=await fetchDashboard();if(ok)toast('محدودیت‌ها و اطلاعات حساب به‌روزرسانی شد.');else toast('دریافت اطلاعات حساب ناموفق بود.','bad');break;}case'page-prev':state.offset=Math.max(0,state.offset-state.limit);fetchServices();break;case'page-next':if(state.offset+state.limit<state.total){state.offset+=state.limit;fetchServices()}break;case'detail':await openService(btn.dataset.username);break;case'edit-owner':openOwnerEditor(btn.dataset.username);break;case'find-service':showFindModal();break;case'service-operation':openOperation(btn.dataset.username,btn.dataset.op,btn.dataset.status);break;case'execute-confirm':{const payload=JSON.parse(btn.dataset.payload);await executeConfirmed(payload,btn);break}case'copy-text':await copyText(btn.dataset.text||'');break;case'copy-last-response':await copyText(JSON.stringify(state.lastRaw,null,2));break;case'open-sub-link':openLink(btn.dataset.text);break;case'export-data':exportMetadata();break;case'confirm-export-backup':await runFullBackup();break;case'cancel-export-backup':state.pendingBackupOptions=null;closeModal();break;case'select-theme':await selectTheme(btn.dataset.theme);if($('#themeSelect'))$('#themeSelect').value=btn.dataset.theme;break;case'confirm-import-backup':await confirmImportBackup();break;case'execute-api-lab-confirmed':await executeApiLabConfirmed();break;case'cancel-api-lab-confirmed':state.pendingApiLab=null;closeModal();break;case'cancel-import-backup':state.pendingImportData=null;closeModal();break;case'clear-search':if($('#serviceSearch'))$('#serviceSearch').value='';if($('#statusFilter'))$('#statusFilter').value='all';if($('#typeFilter'))$('#typeFilter').value='all';state.serviceQuery='';state.statusFilter='all';state.serviceTypeFilter='all';state.offset=0;fetchServices();break;case'create':loadView('create',true);break;case'services':loadView('services',true);break;case'settings':loadView('settings',true);break;default:break}}catch(err){toast(err.message,'bad')}});
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('#loginBtn');$('#loginError').classList.add('hidden');loadingBtn(btn,true,'در حال ورود…');try{const r=await post('/api/login',{password:$('#loginPassword').value});if(!r.ok)throw new Error(r.error||'ورود ناموفق');const check=await api('/api/auth/check');if(!check.authenticated){showLogin('login',check.error||'رمز پذیرفته شد، اما نشست ورود در درخواست بعدی تأیید نشد؛ دوباره تلاش کن.');return}showApp()}catch(err){$('#loginError').textContent=err.message;$('#loginError').classList.remove('hidden')}finally{loadingBtn(btn,false)}});
$('#setupForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('#setupBtn'),error=$('#setupError');error.classList.add('hidden');loadingBtn(btn,true,'در حال ساخت رمز…');try{const password=$('#setupPassword').value,confirm_password=$('#setupConfirmPassword').value;if(password!==confirm_password)throw new Error('تکرار رمز با رمز واردشده یکسان نیست.');const r=await post('/api/setup',{password,confirm_password,setup_token:$('#setupToken').value});if(!r.ok){if(r.error&&r.error.includes('مدیر قبلاً راه‌اندازی شده')){const check=await api('/api/auth/check');if(check.authenticated){showApp();return}if(check.storage_configured===false){showLogin('storage',check.setup_message||check.error||r.error);return}if(check.setup_required===false){showLogin('login','مدیر قبلاً ساخته شده است؛ با رمز مدیر وارد شو. توکن راه‌اندازی فقط برای ساخت اولین مدیر است.');return}}throw new Error(r.error||'ساخت رمز مدیر ناموفق بود.')}const check=await api('/api/auth/check');if(!check.authenticated){showLogin('login',check.error||'رمز مدیر ثبت شد، اما نشست ورود ایجاد نشد؛ با رمز مدیر وارد شو.');return}showApp()}catch(err){error.textContent=err.message;error.classList.remove('hidden')}finally{loadingBtn(btn,false)}});
// Close modal by clicking the backdrop; Escape closes dialogs.
$('#modalHost').addEventListener('click',e=>{if(e.target===$('#modalHost'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modalHost').classList.contains('hidden'))closeModal()});
(async()=>{try{const r=await api('/api/auth/check');if(r.storage_configured===false){showLogin('storage',r.setup_message||'Storage پایدار را در Vercel تنظیم کن.');return}if(r.authenticated){showApp()}else if(r.setup_required&&r.setup_allowed===false){showLogin('storage',r.setup_message||'متغیر راه‌اندازی در Vercel تنظیم نشده است.')}else showLogin(r.setup_required?'setup':'login')}catch{showLogin()}})();
})();
